name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
        run: |
          archive="$RUNNER_TEMP/swiftlint_linux_amd64.zip"
          install_dir="$RUNNER_TEMP/swiftlint"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" \
            --output "$archive"
          echo "${SWIFTLINT_SHA256}  ${archive}" | sha256sum --check --status
          mkdir --parents "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/swiftlint"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: テスト実行
        run: |
          set -o pipefail
          xcodebuild test \
            -project Sobani.xcodeproj \
            -scheme Sobani \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcbeautify
