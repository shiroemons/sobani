name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: 証明書インポート
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "✅ Developer ID 証明書をインポートしました"

      - name: create-dmg インストール
        run: brew install create-dmg

      - name: バージョン抽出
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]{6}\.[0-9]+$ ]]; then
            echo "❌ 不正なタグ形式: $TAG (期待: vYYYYMM.N)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📌 Tag: $TAG, Version: $VERSION"

      - name: Xcode バージョン選択
        run: |
          ls /Applications/ | grep Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version
          swift --version

      - name: ユニバーサルビルド・署名・公証
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: SOBANI_ARCHS="arm64 x86_64" NOTARIZE=1 CREATE_DMG=1 ./build.sh

      - name: バイナリ検証
        run: |
          echo "🔍 バイナリアーキテクチャを確認中..."
          ARCHS=$(lipo -info Sobani.app/Contents/MacOS/Sobani)
          echo "$ARCHS"
          echo "$ARCHS" | grep -q "arm64" || { echo "❌ arm64 が見つかりません"; exit 1; }
          echo "$ARCHS" | grep -q "x86_64" || { echo "❌ x86_64 が見つかりません"; exit 1; }
          echo "✅ ユニバーサルバイナリ確認完了"

      - name: 署名検証
        run: |
          echo "🔍 コード署名を検証中..."
          codesign --verify --deep --strict --verbose=2 Sobani.app
          echo "🔍 公証ステープルを検証中..."
          xcrun stapler validate Sobani.app
          echo "✅ 署名・公証検証完了"

      - name: DMG リネーム
        id: dmg
        run: |
          DMG_NAME="Sobani-universal.dmg"
          mv Sobani.dmg "$DMG_NAME"
          echo "name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "💿 $DMG_NAME を作成しました"

      - name: ZIP 作成
        id: zip
        run: |
          ZIP_NAME="Sobani-universal.zip"
          ditto -c -k --keepParent Sobani.app "$ZIP_NAME"
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "📦 $ZIP_NAME を作成しました"

      - name: EdDSA 署名生成
        id: sparkle_sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DMG_NAME: ${{ steps.dmg.outputs.name }}
        run: |
          echo "Sparkle EdDSA 署名を生成中..."
          curl -sL https://github.com/sparkle-project/Sparkle/releases/download/2.9.0/Sparkle-2.9.0.tar.xz -o /tmp/Sparkle.tar.xz
          mkdir -p /tmp/sparkle-tools
          tar xf /tmp/Sparkle.tar.xz -C /tmp/sparkle-tools
          SIGN_OUTPUT=$(echo "$SPARKLE_PRIVATE_KEY" | /tmp/sparkle-tools/bin/sign_update "$DMG_NAME" -f -)
          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"' | sed 's/sparkle:edSignature="//;s/"//')
          DMG_LENGTH=$(stat -f%z "$DMG_NAME")
          echo "ed_signature=$ED_SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "dmg_length=$DMG_LENGTH" >> "$GITHUB_OUTPUT"
          echo "EdDSA 署名: $ED_SIGNATURE"
          echo "DMG サイズ: $DMG_LENGTH bytes"

      - name: SHA256 計算
        id: sha
        env:
          DMG_NAME: ${{ steps.dmg.outputs.name }}
          ZIP_NAME: ${{ steps.zip.outputs.name }}
        run: |
          DMG_SHA256=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          ZIP_SHA256=$(shasum -a 256 "$ZIP_NAME" | awk '{print $1}')
          echo "dmg_sha256=$DMG_SHA256" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
          echo "🔐 DMG SHA256: $DMG_SHA256"
          echo "🔐 ZIP SHA256: $ZIP_SHA256"

      - name: checksums.txt 作成
        env:
          DMG_SHA256: ${{ steps.sha.outputs.dmg_sha256 }}
          DMG_NAME: ${{ steps.dmg.outputs.name }}
          ZIP_SHA256: ${{ steps.sha.outputs.zip_sha256 }}
          ZIP_NAME: ${{ steps.zip.outputs.name }}
        run: |
          echo "$ZIP_SHA256  $ZIP_NAME" > checksums.txt
          echo "$DMG_SHA256  $DMG_NAME" >> checksums.txt
          echo "📝 checksums.txt を作成しました"

      - name: GitHub Release 作成
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG_NAME: ${{ steps.dmg.outputs.name }}
          ZIP_NAME: ${{ steps.zip.outputs.name }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "$DMG_NAME" \
            "$ZIP_NAME" \
            checksums.txt \
            --generate-notes

      - name: appcast.xml 更新
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ED_SIGNATURE: ${{ steps.sparkle_sign.outputs.ed_signature }}
          DMG_LENGTH: ${{ steps.sparkle_sign.outputs.dmg_length }}
          DMG_NAME: ${{ steps.dmg.outputs.name }}
        run: |
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/shiroemons/sobani.git"
          git fetch origin main
          git checkout main

          # Insert new item after <language>ja</language>
          awk -v tag="$TAG" -v pub="$PUB_DATE" -v ver="$VERSION" -v len="$DMG_LENGTH" -v sig="$ED_SIGNATURE" -v dmg="$DMG_NAME" '
          /<language>ja<\/language>/ {
            print
            print "    <item>"
            print "      <title>" tag "</title>"
            print "      <pubDate>" pub "</pubDate>"
            print "      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>"
            print "      <enclosure"
            print "        url=\"https://github.com/shiroemons/sobani/releases/download/" tag "/" dmg "\""
            print "        type=\"application/octet-stream\""
            print "        sparkle:version=\"" ver "\""
            print "        sparkle:shortVersionString=\"" ver "\""
            print "        length=\"" len "\""
            print "        sparkle:edSignature=\"" sig "\""
            print "      />"
            print "    </item>"
            next
          }
          { print }
          ' docs/appcast.xml > /tmp/appcast_new.xml
          mv /tmp/appcast_new.xml docs/appcast.xml

          xmllint --noout docs/appcast.xml

          git add docs/appcast.xml
          git commit -m "chore: appcast.xml を ${TAG} に更新"
          git push origin main
          echo "✅ appcast.xml を更新しました"

      - name: Homebrew Tap 更新
        env:
          TAP_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha.outputs.dmg_sha256 }}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/shiroemons/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Casks

          cat > /tmp/homebrew-tap/Casks/sobani.rb <<EOF
          cask "sobani" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/shiroemons/sobani/releases/download/v#{version}/Sobani-universal.dmg"
            name "Sobani"
            desc "Desktop mascot app that displays character images"
            homepage "https://github.com/shiroemons/sobani"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "Sobani.app"

            zap trash: [
              "~/Library/Application Support/Sobani",
            ]
          end
          EOF

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sobani.rb
          git commit -m "sobani v${VERSION} に更新"
          git push

      - name: クリーンアップ
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
