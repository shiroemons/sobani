included:
  - Sobani
  - SobaniTests

excluded:
  - build
  - DerivedData
  - Sobani.app
  - .build

line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 850
  error: 1500

disabled_rules:
  - trailing_comma
  - force_try

opt_in_rules:
  - empty_count
  - closure_spacing
  - collection_alignment
  - first_where
  - sorted_first_last
  - contains_over_first_not_nil
  - prefer_self_in_static_references
  - explicit_init
  - toggle_bool
  - unowned_variable_capture
  - weak_delegate
  - overridden_super_call
  - prohibited_super_call
  - redundant_type_annotation
  - fatal_error_message
  - discouraged_none_name
  - file_name_no_space

identifier_name:
  excluded:
    - fm
    - w
    - x
    - y
    - h
    - iv
    - L
